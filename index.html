<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>YT Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #222;
    --red: #ff2d2d;
    --red-dim: #cc1f1f;
    --white: #f0f0f0;
    --muted: #555;
    --text: #ccc;
    --radius: 10px;
  }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px 40px;
  }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 700px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 48px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: var(--red);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .logo h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    letter-spacing: 2px;
    color: var(--white);
  }

  .logo h1 span { color: var(--red); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 24px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    padding: 14px 18px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus {
    border-color: var(--red);
  }

  input[type="text"]::placeholder { color: var(--muted); }

  .btn {
    background: var(--red);
    color: #fff;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 1.5px;
    padding: 14px 28px;
    border-radius: var(--radius);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, transform 0.1s;
  }

  .btn:hover { background: var(--red-dim); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { background: #333; color: #666; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }

  .btn-ghost:hover { border-color: var(--muted); color: var(--white); }

  /* Video Preview */
  #preview {
    display: none;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    gap: 16px;
    align-items: flex-start;
  }

  #preview.show { display: flex; }

  #preview img {
    width: 160px;
    height: 90px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
    background: #1a1a1a;
  }

  .preview-info { flex: 1; }
  .preview-title { font-size: 1rem; font-weight: 500; margin-bottom: 6px; line-height: 1.3; }
  .preview-meta { font-size: 0.8rem; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
  .preview-meta span { display: flex; align-items: center; gap: 4px; }

  .preview-actions { margin-top: 14px; display: flex; gap: 8px; }

  /* Progress */
  #progress-section {
    display: none;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  #progress-section.show { display: block; }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .progress-bar-track {
    height: 4px;
    background: #222;
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--red);
    border-radius: 4px;
    width: 0%;
    transition: width 0.4s ease;
  }

  .status-text {
    margin-top: 10px;
    font-size: 0.82rem;
    color: var(--muted);
  }

  /* Downloads list */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  #downloads-list { display: flex; flex-direction: column; gap: 8px; }

  .dl-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  .dl-icon {
    width: 36px; height: 36px;
    background: #1a1a1a;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }

  .dl-name {
    flex: 1;
    font-size: 0.88rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }

  .dl-size {
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .empty-state {
    text-align: center;
    padding: 32px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .error-msg {
    background: #1a0a0a;
    border: 1px solid #5a1a1a;
    color: #ff6b6b;
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 0.88rem;
    margin-top: 12px;
    display: none;
  }

  .error-msg.show { display: block; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #333;
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .badge {
    display: inline-block;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: var(--muted);
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="container">

  <div class="logo">
    <div class="logo-icon">▶</div>
    <h1>YT<span>GRAB</span></h1>
  </div>

  <div class="card">
    <div class="input-row">
      <input type="text" id="url-input" placeholder="Paste YouTube URL here…" autocomplete="off" />
      <button class="btn" id="fetch-btn" onclick="fetchInfo()">FETCH</button>
    </div>
    <div id="error-msg" class="error-msg"></div>

    <!-- Preview -->
    <div id="preview">
      <img id="thumb" src="" alt="thumbnail" />
      <div class="preview-info">
        <div class="preview-title" id="vid-title"></div>
        <div class="preview-meta">
          <span>👤 <span id="vid-uploader"></span></span>
          <span>⏱ <span id="vid-duration"></span></span>
          <span>👁 <span id="vid-views"></span></span>
        </div>
        <div class="preview-actions">
          <button class="btn" id="dl-btn" onclick="startDownload()">⬇ DOWNLOAD BEST</button>
          <span class="badge">MP4 · Best Quality</span>
        </div>
      </div>
    </div>

    <!-- Progress -->
    <div id="progress-section">
      <div class="progress-label">
        <span><span class="spinner"></span> Downloading…</span>
        <span id="percent-text">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="status-text" id="status-text">Starting download…</div>
    </div>
  </div>

  <!-- Downloads -->
  <div class="section-title">Downloaded Files</div>
  <div id="downloads-list">
    <div class="empty-state">No downloads yet.</div>
  </div>

</div>

<script>
  let currentJobId = null;
  let pollInterval = null;
  let currentInfo = null;

  const $ = id => document.getElementById(id);

  $('url-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchInfo();
  });

  function showError(msg) {
    const el = $('error-msg');
    el.textContent = msg;
    el.classList.add('show');
  }

  function hideError() {
    $('error-msg').classList.remove('show');
  }

  function formatViews(n) {
    if (!n) return 'N/A';
    if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return n;
  }

  function formatSize(bytes) {
    if (bytes > 1e9) return (bytes / 1e9).toFixed(2) + ' GB';
    if (bytes > 1e6) return (bytes / 1e6).toFixed(1) + ' MB';
    return (bytes / 1e3).toFixed(0) + ' KB';
  }

  async function fetchInfo() {
    const url = $('url-input').value.trim();
    if (!url) return;
    hideError();
    $('preview').classList.remove('show');
    $('progress-section').classList.remove('show');
    $('fetch-btn').disabled = true;
    $('fetch-btn').textContent = 'LOADING…';

    try {
      const res = await fetch(`/api/info?url=${encodeURIComponent(url)}`);
      const data = await res.json();
      if (!res.ok || data.error) { showError(data.error || 'Failed to fetch video info.'); return; }

      currentInfo = data;
      $('thumb').src = data.thumbnail;
      $('vid-title').textContent = data.title;
      $('vid-uploader').textContent = data.uploader;
      $('vid-duration').textContent = data.duration;
      $('vid-views').textContent = formatViews(data.view_count) + ' views';
      $('preview').classList.add('show');
    } catch (e) {
      showError('Server error. Make sure the backend is running.');
    } finally {
      $('fetch-btn').disabled = false;
      $('fetch-btn').textContent = 'FETCH';
    }
  }

  async function startDownload() {
    const url = $('url-input').value.trim();
    $('dl-btn').disabled = true;
    $('progress-section').classList.add('show');
    $('progress-fill').style.width = '0%';
    $('percent-text').textContent = '0%';
    $('status-text').textContent = 'Initializing…';

    try {
      const res = await fetch('/api/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      if (data.error) { showError(data.error); $('dl-btn').disabled = false; return; }
      currentJobId = data.job_id;
      pollProgress();
    } catch (e) {
      showError('Could not start download.');
      $('dl-btn').disabled = false;
    }
  }

  function pollProgress() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(async () => {
      try {
        const res = await fetch(`/api/progress?job_id=${currentJobId}`);
        const d = await res.json();

        const pct = Math.min(d.percent || 0, 100);
        $('progress-fill').style.width = pct + '%';
        $('percent-text').textContent = pct.toFixed(1) + '%';

        if (d.filename) {
          $('status-text').textContent = 'Saving: ' + d.filename;
        }

        if (d.status === 'done') {
          clearInterval(pollInterval);
          $('status-text').textContent = '✅ Download complete!';
          $('dl-btn').disabled = false;
          loadDownloads();
        } else if (d.status === 'error') {
          clearInterval(pollInterval);
          $('status-text').textContent = '❌ ' + (d.error || 'Download failed.');
          $('dl-btn').disabled = false;
        }
      } catch {}
    }, 800);
  }

  async function loadDownloads() {
    try {
      const res = await fetch('/api/downloads');
      const files = await res.json();
      const list = $('downloads-list');
      if (!files.length) {
        list.innerHTML = '<div class="empty-state">No downloads yet.</div>';
        return;
      }
      list.innerHTML = files.map(f => `
        <div class="dl-item">
          <div class="dl-icon">🎬</div>
          <div class="dl-name" title="${f.name}">${f.name}</div>
          <div class="dl-size">${formatSize(f.size)}</div>
        </div>
      `).join('');
    } catch {}
  }

  loadDownloads();
  setInterval(loadDownloads, 5000);
</script>
</body>
</html>
